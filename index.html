<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 داشبورد قیمت‌های لحظه‌ای</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 داشبورد قیمت‌های لحظه‌ای</h1>
            <p class="subtitle">مدیریت مانیتورها و صفحه Telegraph</p>
            <div class="status-bar">
                <div class="status-item"><span class="status-dot" id="statusDot"></span><span id="statusText">—</span></div>
                <div class="status-item"><span>⏱</span><span id="intervalDisplay">—</span></div>
                <div class="status-item"><span>🟢</span><span id="activeCount">—</span></div>
                <div class="status-item"><span>⚪</span><span id="disabledCount">—</span></div>
            </div>
        </header>

        <div class="card">
            <h2 class="card-title">🔗 اتصال به ورکر</h2>
            <div class="form-row">
                <div class="form-group" style="flex:1"><label>آدرس Cloudflare Worker</label><input type="url" id="apiUrl" placeholder="https://crypto-paragraph.xxx.workers.dev"></div>
                <button class="btn btn-primary" onclick="saveApiUrl()" style="align-self:end">اتصال</button>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">📝 صفحه Telegraph</h2>
            <div id="telegraphCreate" style="display:none">
                <p style="margin-bottom:10px;color:#888;font-size:.9em;">صفحه Telegraph برای Instant View تلگرام:</p>
                <div class="form-row">
                    <div class="form-group" style="flex:1"><label>نام کوتاه اکانت</label><input type="text" id="telegraphName" value="cryptoprice"></div>
                    <button class="btn btn-success" onclick="createTGAccount()" style="align-self:end">ساخت اکانت</button>
                </div>
            </div>
            <div id="telegraphInfo" style="display:none">
                <p style="margin-bottom:8px;">✅ صفحه فعال:</p>
                <div class="link-box" id="telegraphUrl"></div>
                <div class="controls" style="margin-top:12px;gap:8px">
                    <button class="btn btn-primary" onclick="copyLink()">کپی لینک</button>
                    <button class="btn btn-secondary" onclick="updateTGNow()">🔄 آپدیت</button>
                    <a id="openLink" target="_blank" class="btn btn-secondary" style="text-decoration:none">↗ باز کردن</a>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('active')" id="tab-active">🟢 فعال <span class="badge" id="badgeActive">0</span></button>
                <button class="tab-btn" onclick="switchTab('disabled')" id="tab-disabled">⚪ غیرفعال <span class="badge" id="badgeDisabled">0</span></button>
                <button class="btn btn-primary btn-sm" onclick="showAddForm()" style="margin-right:auto">➕ افزودن</button>
            </div>
            <div id="addForm" class="add-panel" style="display:none">
                <h3 style="margin-bottom:12px">➕ مانیتور جدید</h3>
                <div class="grid-2">
                    <div class="form-group"><label>نام انگلیسی</label><input id="fName" placeholder="btc_irt"></div>
                    <div class="form-group"><label>برچسب فارسی</label><input id="fLabel" placeholder="بیت‌کوین"></div>
                    <div class="form-group"><label>منبع</label><select id="fSource"><option value="bitpin">بیت‌پین</option><option value="frankfurter">فرانکفرتر</option></select></div>
                    <div class="form-group"><label>کد</label><input id="fCode" placeholder="BTC_IRT" style="text-transform:uppercase"></div>
                    <div class="form-group"><label>دسته</label><select id="fCat"><option value="crypto">💰 ارز دیجیتال</option><option value="gold">🥇 طلا</option><option value="currency">💵 ارزها</option><option value="other">📊 سایر</option></select></div>
                    <div class="form-group"><label>واحد</label><input id="fUnit" placeholder="تومان"></div>
                    <div class="form-group"><label>اعشار</label><input id="fDec" type="number" value="0" min="0" max="10"></div>
                    <div class="form-group"><label>نمایش تغییر</label><select id="fShowCh"><option value="true">بله</option><option value="false">خیر</option></select></div>
                </div>
                <div class="presets" style="margin:12px 0">
                    <span style="font-size:.8em;color:#888">پیشنهاد:</span>
                    <button class="chip" onclick="fillForm({name:'btc_irt',label:'بیت‌کوین',source:'bitpin',code:'BTC_IRT',cat:'crypto',unit:'تومان',dec:0,show:true})">BTC</button>
                    <button class="chip" onclick="fillForm({name:'eth_irt',label:'اتریوم',source:'bitpin',code:'ETH_IRT',cat:'crypto',unit:'تومان',dec:0,show:true})">ETH</button>
                    <button class="chip" onclick="fillForm({name:'bnb_irt',label:'باینانس',source:'bitpin',code:'BNB_IRT',cat:'crypto',unit:'تومان',dec:0,show:true})">BNB</button>
                    <button class="chip" onclick="fillForm({name:'sol_irt',label:'سولانا',source:'bitpin',code:'SOL_IRT',cat:'crypto',unit:'تومان',dec:0,show:true})">SOL</button>
                    <button class="chip" onclick="fillForm({name:'xau_usd',label:'انس طلا',source:'frankfurter',code:'XAU',cat:'gold',unit:'دلار',dec:2,show:false})">XAU</button>
                    <button class="chip" onclick="fillForm({name:'eur_usd',label:'یورو',source:'frankfurter',code:'EUR',cat:'currency',unit:'دلار',dec:4,show:false})">EUR</button>
                    <button class="chip" onclick="fillForm({name:'usd_irt_x',label:'دلار آمریکا',source:'frankfurter',code:'USD',cat:'currency',unit:'تومان',dec:0,show:true,convertToIRT:true})">USD</button>
                </div>
                <div style="display:flex;gap:8px">
                    <button class="btn btn-success" onclick="addMonitor()">افزودن</button>
                    <button class="btn btn-secondary" onclick="hideAddForm()">انصراف</button>
                </div>
            </div>
            <div class="search-row">
                <input type="text" id="searchBox" placeholder="🔍 جستجو..." oninput="renderMonitors()">
            </div>
            <div class="monitor-list" id="monitorList"><div class="empty-state">—</div></div>
        </div>

        <div class="card">
            <h2 class="card-title">📝 قالب پیام</h2>
            <div class="form-group" style="margin-bottom:10px">
                <label>قالب ({label}, {price}, {change})</label>
                <textarea id="templateInput" rows="2" style="width:100%;font-family:monospace;padding:10px;border-radius:8px;border:1px solid #0f3460;background:rgba(26,26,46,.5);color:#e0e0e0">▫️ {label}: {price} ({change})</textarea>
            </div>
            <div class="form-row" style="display:flex;gap:12px;align-items:end">
                <div class="form-group" style="flex:1"><label>فاصله به‌روزرسانی (دقیقه)</label><input type="number" id="intervalInput" value="120" min="5" max="1440"></div>
                <button class="btn btn-primary" onclick="saveTemplate()">ذخیره</button>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">👁️ پیش‌نمایش Telegraph</h2>
            <div class="preview-box" id="previewBox">—</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
