<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 داشبورد قیمت‌های لحظه‌ای</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 داشبورد قیمت‌های لحظه‌ای</h1>
            <div class="status-bar">
                <div class="status-item"><span class="status-dot" id="statusDot"></span><span id="statusText">در حال اتصال...</span></div>
                <div class="status-item"><span>⏱</span><span id="intervalDisplay">—</span></div>
                <div class="status-item"><span>📡</span><span id="monitorCount">—</span></div>
            </div>
        </header>

        <div class="card">
            <h2 class="card-title">⚙️ کنترل</h2>
            <div class="controls">
                <button class="btn btn-primary" onclick="forceUpdate()">🔄 به‌روزرسانی فوری</button>
                <button class="btn btn-secondary" onclick="refreshData()">🔄 بارگذاری مجدد</button>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">🔗 تنظیمات API</h2>
            <div class="form-row">
                <div class="form-group" style="flex:1"><label>آدرس Cloudflare Worker</label><input type="url" id="apiUrl" placeholder="https://crypto-paragraph.xxx.workers.dev"></div>
                <button class="btn btn-primary" onclick="saveApiUrl()" style="align-self:end">ذخیره</button>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">📝 صفحه Telegraph</h2>
            <div id="telegraphSection">
                <div id="telegraphCreate" style="display:none">
                    <p style="margin-bottom:10px; color:#888;">اکانت Telegraph نسخه رایگان تلگرام - صفحه قیمت‌ها اینجا میزبانی می‌شود:</p>
                    <div class="form-row">
                        <div class="form-group" style="flex:1"><label>نام کوتاه</label><input type="text" id="telegraphName" value="cryptoprice"></div>
                        <button class="btn btn-success" onclick="createTelegraphAccount()" style="align-self:end">ساخت اکانت</button>
                    </div>
                </div>
                <div id="telegraphInfo" style="display:none">
                    <p style="margin-bottom:8px;">✅ صفحه فعال:</p>
                    <div class="link-box" id="telegraphUrl"></div>
                    <div class="controls" style="margin-top:10px">
                        <button class="btn btn-primary" onclick="copyLink()">کپی لینک</button>
                        <button class="btn btn-secondary" onclick="updateTelegraphNow()">آپدیت صفحه</button>
                        <a id="openLink" target="_blank" class="btn btn-secondary" style="text-decoration:none;">باز کردن</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">➕ افزودن مانیتور</h2>
            <form class="add-monitor-form" onsubmit="addMonitor(event)">
                <div class="form-group"><label>نام انگلیسی</label><input type="text" id="newName" required></div>
                <div class="form-group"><label>برچسب فارسی</label><input type="text" id="newLabel" required></div>
                <div class="form-group"><label>منبع</label><select id="newSource"><option value="bitpin">بیت‌پین</option><option value="frankfurter">فرانکفرتر</option></select></div>
                <div class="form-group"><label>کد</label><input type="text" id="newCode" required></div>
                <div class="form-group"><label>اعشار</label><input type="number" id="newDecimals" value="0" min="0" max="10"></div>
                <div class="form-group"><label>واحد</label><input type="text" id="newUnit" placeholder="تومان، دلار"></div>
                <div class="form-group"><label>ترتیب</label><input type="number" id="newSortOrder" value="0"></div>
                <div class="form-group"><label>نمایش تغییر</label><select id="newShowChange"><option value="true">بله</option><option value="false">خیر</option></select></div>
                <div class="form-group full-width"><button type="submit" class="btn btn-primary" style="width:100%">افزودن</button></div>
            </form>
        </div>

        <div class="card"><h2 class="card-title">📡 مانیتورها</h2><div class="monitor-grid" id="monitorsList"><div class="empty-state">در حال بارگذاری...</div></div></div>
        <div class="card"><h2 class="card-title">📝 قالب پیام</h2><form onsubmit="updateTemplate(event)"><div class="form-group" style="margin-bottom:10px"><label>قالب</label><textarea id="templateInput" style="width:100%; min-height:50px; font-family:monospace; padding:8px; border-radius:6px; border:1px solid #0f3460; background:rgba(26,26,46,0.5); color:#e0e0e0;">▫️ {label}: {price} ({change})</textarea></div><div class="form-row" style="display:flex; gap:10px; align-items:end"><div class="form-group" style="flex:1"><label>فاصله (دقیقه)</label><input type="number" id="intervalInput" value="120" min="5" max="1440"></div><button type="submit" class="btn btn-primary">ذخیره</button></div></form></div>
        <div class="card"><h2 class="card-title">👁️ پیش‌نمایش</h2><div class="preview-box" id="previewBox">در حال بارگذاری...</div></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
